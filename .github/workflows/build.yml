name: build
on:
  push:
    branches: [master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            script: build_debug.py
            preset: windows-msvc-debug
          - configuration: Release
            script: build_release.py
            preset: windows-msvc-release
    steps:
      - uses: actions/checkout@v4
      - name: Install Conan
        run: pip install conan
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'profiles/**') }}
      - name: Generate project files
        run: python automation/generate_project_files.py
      - name: Build ${{ matrix.configuration }}
        run: python automation/${{ matrix.script }}
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.configuration }}
          path: |
            build/${{ matrix.preset }}/bin/App.exe
            build/${{ matrix.preset }}/bin/config.json

  linux:
    name: linux-${{ matrix.configuration }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: Debug
            script: build_debug.py
            preset: linux-gcc-debug
          - configuration: Release
            script: build_release.py
            preset: linux-gcc-release
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 and Conan
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
          # Profiles use system gcc/g++; make GCC 14 the default on Ubuntu 24.04.
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100
          pipx install conan
      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'profiles/**') }}
      - name: Generate project files
        run: python3 automation/generate_project_files.py
      - name: Build ${{ matrix.configuration }}
        run: python3 automation/${{ matrix.script }}
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: app-linux-${{ matrix.configuration }}
          path: |
            build/${{ matrix.preset }}/bin/App
            build/${{ matrix.preset }}/bin/config.json
